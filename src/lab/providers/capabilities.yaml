# Settings each model accepts. The harness checks every planned call against this file before
# any call is made, and refuses a setting a model does not support rather than changing it.
#
# Verified against provider documentation on 16 September 2026; the Season 3 models were
# re-verified on 18 October 2026 (models, deprecations and pricing pages below), then by
# `lab smoke` with season3/smoke.yaml. Provider behaviour changes
# often: re-verify before a paid run, and update this file rather than working around an error.
#
#   reasoning           neutral levels the harness may send; "off" means fully disabled
#   temperature         whether a temperature may be sent at all
#   max_output_tokens   the provider's documented output limit, where published
#   fine_tunable        whether the provider's own API can tune the model (default false)
#   tuning_method       supervised and/or preference, only where fine_tunable is true
#   structured_output   none, json_mode or schema; left unset until verified for the model
#
# Season 4 re-verification, 22 November 2026. No model listed here can be tuned through its
# provider's own API:
#   OpenAI: the gpt-6-luna page lists fine-tuning "Not supported"; the pricing page says
#     "Fine-tuning is closed to new users"; the deprecations page ends self-serve job creation
#     on 6 January 2027, and the remaining tunable base models shut down on 14 January 2027.
#   Google: the Gemini API "no longer" has a model that supports fine-tuning.
#   Anthropic: the models and pricing pages offer no fine-tuning on the first-party API.
# Season 4 therefore tunes an open-weight model on Colab (season4/PLAN.md).
#
# Season 5 re-verification, 27 November 2026, for tool calling and image input. New fields:
#   tool_calling             none, basic (one call a turn) or parallel; unset means unverified
#   image_input              true only where the model page lists image input
#   max_images_per_request   the provider's documented limit, where published
# No page read shows a last-updated date. Confirmed by `lab smoke` with season5/smoke.yaml on
# 27 November 2026: gpt-6-luna and claude-haiku-5-5 each made a tool call, two calls in one
# turn, used a tool result, and read an invented rating plate's serial number correctly.
#   OpenAI: the gpt-6-luna page lists function_calling, structured_outputs and image_input;
#     input text and image; context 1,050,000, output 128,000; effort none to max; one
#     snapshot, no deprecation. The function calling guide says to assume several calls a
#     turn. gpt-5-nano is cheaper but is marked deprecated, so gpt-6-luna stays the cheapest.
#     Images: up to 1,500 a request; patch count ceil(w/32) x ceil(h/32) times a model factor.
#   Anthropic: "All current models support text and image input ... vision, and tool use";
#     claude-haiku-5-5 is current, retirement not sooner than 7 October 2027; up to 600 images
#     a request; an image costs ceil(w/28) x ceil(h/28) tokens. No cheaper Claude model.
#   Google: neither the models page nor the function calling page states tool calling or image
#     input for gemini-3.1-flash-lite or gemini-3.6-flash. Season 5 uses them only without
#     tools or images (data generation, the E5 judge), so both fields stay unset.
#   Sources added:
#     https://developers.openai.com/api/docs/guides/function-calling
#     https://developers.openai.com/api/docs/guides/images-vision
#     https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
#     https://platform.claude.com/docs/en/build-with-claude/vision
#     https://aistudio.google.com/docs/function-calling
#     https://aistudio.google.com/docs/image-understanding
#
# Sources:
#   https://developers.openai.com/api/docs/models
#   https://developers.openai.com/api/docs/guides/reasoning
#   https://platform.claude.com/docs/en/about-claude/models/overview
#   https://platform.claude.com/docs/en/build-with-claude/effort
#   https://platform.claude.com/docs/en/build-with-claude/thinking
#   https://ai.google.dev/gemini-api/docs/models
#   https://ai.google.dev/gemini-api/docs/thinking
#   https://ai.google.dev/gemini-api/docs/generate-content/thinking
#   https://ai.google.dev/gemini-api/docs/models/gemini-2.5-flash
#   https://developers.openai.com/api/docs/models/gpt-6-luna
#   https://developers.openai.com/api/docs/pricing
#   https://developers.openai.com/api/docs/guides/model-optimization
#   https://developers.openai.com/api/docs/deprecations
#   https://platform.claude.com/docs/en/about-claude/pricing
#   https://platform.claude.com/docs/en/build-with-claude/structured-outputs
#   https://aistudio.google.com/docs/model-tuning
#   https://aistudio.google.com/docs/structured-output
#   https://aistudio.google.com/docs/pricing

openai:
  # reasoning.effort "none" is the neutral "off". Temperature support for these models is not
  # documented, so it is treated as unsupported until `lab smoke` confirms otherwise.
  # Season 2 answer model. Verified 11 October 2026: "none" and "minimal" are not supported,
  # so reasoning cannot be turned off; low is the lowest level. Temperature 0 was sent once on
  # 11 October 2026 and rejected with HTTP 400 ("not supported with this model").
  gpt-6.1-sol:
    reasoning: [low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  # Season 2 answer model from S2 E4, chosen for cost. Verified 12 October 2026 with one call:
  # reasoning effort "none" is accepted and returns 0 reasoning tokens; temperature is rejected
  # with HTTP 400. Season 4 answer model. 22 November 2026: structured_outputs listed as
  # supported; fine-tuning not supported; only snapshot gpt-6-luna, no deprecation date.
  gpt-6-luna:
    # Season 5 agent. 27 November 2026: tool calling and image input listed.
    reasoning: [off, low, medium, high]
    temperature: false
    max_output_tokens: 128000
    structured_output: schema
    tool_calling: parallel
    image_input: true
    max_images_per_request: 1500
  # Candidate S2 judge, for cost ($0.25 / $2.00). Like gpt-5-nano, checked 12 October 2026:
  # effort "none" is rejected, "minimal" is its lowest level, temperature is rejected.
  gpt-5-mini:
    reasoning: [minimal, low, medium, high]
    temperature: false
    max_output_tokens: 128000
  gpt-6-astra:
    reasoning: [low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  gpt-5.6-sol:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  gpt-5.6-terra:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  # Season 3 E9's version arm. Re-verified 18 October 2026: no deprecation entry; effort none
  # to max.
  gpt-5.6-luna:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000

anthropic:
  # Season 3 (E3). Re-verified 18 October 2026: current, retirement not before 22 September
  # 2027; effort low to max; thinking cannot be disabled at any effort.
  claude-opus-5-5:
    reasoning: [low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  # Season 3 (E3, E9). Re-verified 18 October 2026: current, retirement not before 7 October
  # 2027; effort low to max; thinking {"type": "disabled"} is accepted at high effort or below.
  # Season 4 label checker and second judge. 22 November 2026: listed under structured outputs
  # (stable, output_config.format json_schema). Prompts over 100,000 tokens pay five times the
  # rate, so keep Season 4 prompts below that.
  # Season 5 label checker. 27 November 2026: tool use and vision on every current model.
  claude-haiku-5-5:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
    structured_output: schema
    tool_calling: parallel
    image_input: true
    max_images_per_request: 600
  # Current models reject any non-default temperature. Reasoning levels map to
  # output_config.effort with adaptive thinking; "off" maps to thinking disabled.
  claude-fable-5-1:
    reasoning: [low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  # Season 2 judge. Verified 11 October 2026: any non-default temperature returns HTTP 400;
  # "off" is sent as thinking {"type": "between_tools"}, because {"type": "disabled"} is a 400.
  claude-sonnet-5-5:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  claude-opus-5:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  claude-sonnet-5:
    reasoning: [off, low, medium, high, xhigh, max]
    temperature: false
    max_output_tokens: 128000
  claude-haiku-4-5-20251001:
    # Retirement not sooner than 15 October 2026. Extended thinking only, so effort levels
    # are not offered here.
    reasoning: ["off"]
    temperature: true
    max_output_tokens: 64000

google:
  # Gemini 3 models: levels map to thinking_config.thinking_level. "minimal" is the lowest level
  # on several of them but does not guarantee no thinking.
  # Google recommends leaving temperature at its default of 1.0 for Gemini 3 models.
  # Season 3 (E3). Re-verified 18 October 2026: stable; thinking_level low, medium or high
  # (no minimal).
  gemini-3.8-flash:
    reasoning: [low, medium, high]
    temperature: true
  gemini-3.7-flash:
    reasoning: [low, medium, high]
    temperature: true
  # Season 2 judge from S2 E4, chosen for cost. Thinking cannot be turned off; "minimal" is its
  # default. Google's table lists minimal and high only; confirm with the first call.
  # Season 4 data generator. 22 November 2026: stable; JSON schema output through
  # response_format (the general section names no model restriction; confirm in lab smoke).
  gemini-3.1-flash-lite:
    reasoning: [minimal, high]
    temperature: true
    structured_output: schema
  # Season 2 and Season 4 judge. 22 November 2026: stable, "previous generation"; its price
  # doubles from 1 January 2027, so Season 4 checks a cheaper judge against it.
  gemini-3.6-flash:
    reasoning: [minimal, low, medium, high]
    temperature: true
    structured_output: schema
  gemini-3.5-flash-lite:
    reasoning: [minimal, low, medium, high]
    temperature: true
  # Gemini 2.5 models do not accept thinking_level; they take a thinking_budget in tokens.
  # "off" maps to a budget of 0, which the documentation says disables thinking on Flash and
  # Flash-Lite. Other levels have no documented budget equivalent, so they are not offered.
  # Gemini 2.5 Pro cannot disable thinking and has no levels, so it is not listed.
  # New Gemini API projects often cannot call 2.5 models; keep these for accounts that still
  # have access. Prefer gemini-3.6-flash for new smoke and episode configs.
  # Source: https://ai.google.dev/gemini-api/docs/generate-content/thinking
  gemini-2.5-flash:
    reasoning: ["off"]
    temperature: true
    max_output_tokens: 65536
  gemini-2.5-flash-lite:
    reasoning: ["off"]
    temperature: true
