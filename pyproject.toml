[project]
name = "applied-ai-lab"
version = "0.1.0"
description = "Reproducible experiments behind the applied AI field notes series by Brendan Kelly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brendan Kelly" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "google-genai>=2.23.0",
    "matplotlib>=3.11.2",
    "openai>=3.14.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
lab = "lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Episode samples match slide listings exactly, so the formatter leaves them alone.
exclude = ["episodes/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Slide code is kept short enough to read on a slide: imports may follow the .env loading
# above the slide listing, and zip() is not given strict=, which would push lines past 64
# characters.
"episodes/**" = ["E402", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=lab --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["lab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
