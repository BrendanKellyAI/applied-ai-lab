# The Season 4 reference: the current best rung per task. It changes only when an episode's
# candidate clears the strict bar on test (its Wilson interval on the primary metric sits clear
# above the reference's), recorded in reference_history.yaml. season4/scoreboard.py writes the
# scoreboard and history; this file is written by hand to match the history's last row per task.

# Task A, triage. Joined in S4 E2: the one-line prompt plus the route, fault and safety
# definitions (instructions: definitions in src/lab/adapt/prompts.py), free text output.
# Fully right 521 to 587 of 600 (96% to 99%). E3's similar-8 (593) and E4's JSON mode (594)
# scored higher but their intervals overlap this one, so neither joined. It is also the arm E5
# tunes against: the best prompted arm on dev across E2 to E4 (199 of 200).
task_a:
  episode: s4-e2-instructions-first
  arm: e2-definitions
  answer: {provider: openai, model: gpt-6-luna, reasoning: "off", max_output_tokens: 200}
  instructions: definitions
  examples: none
  output: text

# Task B, house style replies. Joined in S4 E7: Qwen3-0.6B tuned on the 600 train replies (job
# e7-tuned-short-b4, LoRA, batch 4 with 4 accumulation steps), told only "Write the Halvard Home
# reply.". Passes every check and keeps the facts 293 of 300 (95% to 99%), against 0 for E1's
# one-line prompt (0% to 1.3%). It was E7's dev winner (97 of 100). The facts and style judge is
# unchanged.
task_b:
  episode: s4-e7-teaching-a-house-style
  arm: e7-tuned-short
  model: {base: Qwen/Qwen3-0.6B, revision: c1899de289a04d12100db370d81485cdf75e47ca, job: e7-tuned-short-b4}
  judge: {provider: google, model: gemini-3.6-flash, reasoning: minimal, max_output_tokens: 300}
  instructions: short
  examples: none
  output: text
