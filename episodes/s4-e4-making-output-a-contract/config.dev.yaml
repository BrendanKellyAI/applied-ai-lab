# S4 E4, making output a contract, Task A dev. See PREREGISTRATION.md. Base: E3's best arm
# on dev, e3-similar-8 (196 of 200): the one-line prompt and the 8 nearest train messages.
episode: s4-e4-making-output-a-contract
task: a
split: dev
data: ../../datasets/halvard-tasks
answer: {provider: openai, model: gpt-6-luna, reasoning: "off", max_output_tokens: 200}
reference: e4-text
arms:
  - {name: e4-text, instructions: one_line, output: text, examples: {n: 8, selection: similar}}
  - {name: e4-json-mode, instructions: one_line, output: json_mode, examples: {n: 8, selection: similar}}
  - {name: e4-schema, instructions: one_line, output: schema, examples: {n: 8, selection: similar}}
limits:
  openai: {max_concurrency: 8, requests_per_minute: 300}
