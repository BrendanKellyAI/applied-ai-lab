# S4 E4 pass marks, fixed before any call. PREREGISTRATION.md states the same marks in words.
choose:
  split: dev
  metric: fully_right
  tie_break: the stronger contract (arm order below)
  order: [e4-schema, e4-json-mode, e4-text]
claims:
  C1:
    title: A schema makes every reply readable
    rule: e4-schema JSON validity is 1.0
    arm: e4-schema
    validity_at_least: 1.0
  C2:
    title: Constraining the format does not change accuracy
    rule: neither e4-json-mode nor e4-schema differs from e4-text, Holm-corrected exact McNemar p below 0.05
    arms: [e4-json-mode, e4-schema]
    p_below: 0.05
