# S4 E3 pass marks, fixed before any call. PREREGISTRATION.md states the same marks in words.
choose:
  split: dev
  metric: fully_right
  tie_break: fewer examples, then random over similar, then unshuffled (arm order below)
  order: [e3-n0, e3-random-2, e3-random-8, e3-similar-8, e3-random-32]
claims:
  C1:
    title: Examples help
    rule: at least one example arm beats e3-n0, Holm-corrected exact McNemar p below 0.05
    arms: [e3-random-2, e3-random-8, e3-similar-8, e3-random-32]
    p_below: 0.05
  C2:
    title: Returns shrink
    rule: (random-32 minus random-8) is less than (random-8 minus n0), fully right counts
  C3:
    title: Similar examples beat random ones
    rule: e3-similar-8 has more fully right items than e3-random-8 (point estimate)
  C4:
    title: Order alone moves answers
    rule: flips both ways between e3-random-8 and e3-random-8-shuffled are at least 0.02 of items
    flips_at_least: 0.02
