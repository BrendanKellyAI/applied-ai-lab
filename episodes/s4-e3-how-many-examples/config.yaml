# S4 E3, how many examples, Task A test. See PREREGISTRATION.md, Amendment 1: the base is E1's
# one-line prompt.
episode: s4-e3-how-many-examples
task: a
split: test
data: ../../datasets/halvard-tasks
answer: {provider: openai, model: gpt-6-luna, reasoning: "off", max_output_tokens: 200}
