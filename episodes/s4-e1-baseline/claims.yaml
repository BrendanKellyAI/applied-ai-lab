# S4 E1 pass marks, fixed before any call. PREREGISTRATION.md states the same marks in words;
# claims.py applies these to results/analysis-task-*-test.json.
claims:
  C1:
    title: A one-line prompt leaves room to improve on Task A
    task: a
    rule: upper end of the 95% Wilson interval of fully right is below 0.85
    metric: fully_right
    upper_below: 0.85
  C2:
    title: The Task A gap is behaviour, not reading the message
    task: a
    rule: product accuracy is at least 0.90, and fully right is at least 0.15 lower (point estimates)
    product_at_least: 0.90
    gap_at_least: 0.15
  C3:
    title: A one-line prompt misses safety incidents
    task: a
    rule: safety recall is below 0.95 (point estimate)
    metric: safety_recall
    rate_below: 0.95
  C4:
    title: On Task B the model keeps the facts but not the house style
    task: b
    rule: facts kept is at least 0.80 and passing every code check is at most 0.20 (point estimates)
    facts_at_least: 0.80
    all_checks_at_most: 0.20
