             lead: "Visits to the {entity} after the warranty ends are charged at a fixed rate."}
          - {id: war-refurb, kind: weeks, range: [4, 52],
             named: "A refurbished part fitted to the {entity} is covered for {value}.",
             bare: "A refurbished part is covered for {value}.",
             lead: "Refurbished parts are sometimes fitted to the {entity} when new parts are scarce."}
    plan:
      - heading: What the plan adds
        attributes:
          - {id: war-plan-extend, kind: months, range: [12, 60], named: "{entity} extends the standard warranty by {value}.", bare: "The plan extends the standard warranty by {value}."}
          - {id: war-plan-excess, kind: pounds, range: [10, 90], named: "Each claim under {entity} carries an excess of {value}.", bare: "Each claim carries an excess of {value}."}
    region:
