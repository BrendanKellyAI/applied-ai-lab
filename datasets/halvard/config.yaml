          - {id: war-region-visit, kind: hours, range: [24, 96], named: "In {entity}, a warranty engineer visit is offered within {value} of a claim being accepted.", bare: "A warranty engineer visit is offered within {value} of a claim being accepted."}
          - {id: war-region-parts, kind: working_days, range: [1, 60], named: "Parts for warranty repairs in {entity} arrive within {value}.", bare: "Parts for warranty repairs arrive within {value}."}

