# Items per type, test and dev (corpus spec 6.3). Spares are drawn for types whose items the
# checker may reject, and the first that pass are kept.
items:
  policy_single: [40, 10]
  policy_two_sentence: [20, 5]
  policy_heading: [20, 5]
  distractor: [40, 10]
  two_part: [20, 5]
  bridge: [20, 5]
  followup: [40, 10]
  version: [40, 10]
  restricted: [40, 10]
  absent_detail: [40, 10]
  absent_topic: [20, 5]
  deleted: [20, 5]
spare_fraction: 0.25
pilot_per_type: 2

# Removed before comparing a question's words with a fact's (as v1 S2 E3).
stop_words: [
  a, about, above, after, again, against, all, am, an, and, any, are, as, at, be, because,
  been, before, being, below, between, both, but, by, can, could, did, do, does, doing, down,
  during, each, few, for, from, further, get, got, had, has, have, having, he, her, here, hers,
  him, his, how, i, if, in, into, is, it, its, just, me, more, most, my, myself, "no", nor, not,
  now, of, "off", "on", once, only, or, other, our, ours, out, over, own, s, same, she, should, so,
  some, such, t, than, that, the, their, theirs, them, then, there, these, they, this, those,
  through, to, too, under, until, up, very, was, we, were, what, when, where, which, while, who,
  whom, why, will, with, would, you, your, yours, yourself, d, ll, m, re, ve, long, much, many
]

prompts:
  section: |
    You write policy documents for Halvard Home, an invented maker of home appliances, in plain
    UK English. Write the body of one section of the "{title}" policy. The section sits under
    these headings: {path}.

    Write {words} words of clear prose in short paragraphs, as a customer would read it. Do not
    write any heading or title.

    Include each of these sentences exactly as written, word for word, once each:
    {sentences}
    {together}
    Do not write any other number, amount, duration, percentage, measurement or code, in figures
    or in words. Do not name any Halvard Home product {products}. Reply with the section text only.
  internal: |
    You write internal documents for staff at Halvard Home, an invented maker of home
    appliances, in plain UK English. Write the body of one section of the staff-only document
    "{title}". The section sits under these headings: {path}. It is about the {entity}.

    Write {words} words of practical guidance for staff, in short paragraphs. Do not write any
    heading or title.

    Include each of these sentences exactly as written, word for word, once each:
    {sentences}

    Do not write any other number, amount, duration, percentage, measurement or code, in figures
    or in words. Do not name any Halvard Home product other than the {entity}. Reply with the
    section text only.
  intro: |
    You write policy documents for Halvard Home, an invented maker of home appliances, in plain
    UK English. Write the opening of the "{title}" policy: {words} words saying what the policy
    covers and who it is for. Do not write any heading. Do not write any number, amount,
    duration, percentage, measurement or code, in figures or in words, and do not name any
    product. Reply with the text only.
  deleted: |
    You write customer support notices for Halvard Home, an invented maker of home appliances,
    in plain UK English. Write a notice about {accessory} for the {entity}. Start with a short
    title line, then the notice, 90 to 130 words. Include this sentence exactly as written,
    word for word, once:
    {sentences}
    Do not write any other number, amount, duration, percentage, measurement or code, in figures
    or in words. Reply with the notice only.
  retry: |
    Your draft broke a rule: {problem} Write it again, following every rule. Reply with the
    text only.
  question: |
    Here is a fact from Halvard Home's documents:
    "{fact}"
    Write one question {asker} would ask whose answer is this fact. The question must name
    {entity}. It must not contain the answer. Use everyday words rather than copying the fact.
    Reply with the question only.
  two_part: |
    Here are two facts from Halvard Home's documents:
    "{fact}"
    "{fact_b}"
    Write one question a customer would ask that needs both facts to answer. Name {entity} and
    {entity_b}. Do not include either answer. Use everyday words. Reply with the question only.
  bridge: |
    A customer whose home is in postcode area {area} wants the answer to this, for wherever
    they live:
    "{blank}"
    Write the customer's question. It must say their postcode area is {area}. It must not name
    any region or service area. Do not include the answer. Reply with the question only.
  followup: |
    A customer asked: "{first}"
    and was told: "{reply}"
    Write the customer's next message: a short follow-up asking the same thing about {entity}.
    Name {entity}, but do not repeat what is being asked; rely on the earlier question. Use at
    most ten words. Reply with the message only.
  absent_detail: |
    Write one question a customer of Halvard Home might ask about {entity}, whose answer would
    fill the gap in this sentence:
    "{blank}"
    Name {entity}. Reply with the question only.
  absent_topic: |
    Write one question a customer might ask Halvard Home about {topic}. Name it in the question.
    Reply with the question only.
  quote: |
    Here is a support article, and a question a customer asked about it.

    Article:
    {article}

    Question: {question}

    Copy, word for word, the one sentence of the article that answers the question. Reply with
    that sentence only.
  check_system: |
    You check whether a question can be answered from a set of passages. Answer only from the
    passages, never from what you know. Reply with a JSON object and nothing else:
    {"answers": true or false, "passage": the passage number that answers it, or null,
     "reason": "one sentence"}
  check: |
    Question: {question}

    Passages:
    {passages}

    Can the question be answered from these passages alone?
