# The Halvard Home library and test set (Season 2 corpus spec). Every setting the build uses is
# here, so it can be reproduced. Facts, values, item assignments and spans are made in code from
# the seed; the model writes the prose around sentences it is given word for word, and code
# checks every result.
corpus_version: halvard-v2
seed: 20261012
company: Halvard Home
library_date: 2026-10-01
current_from: 2026-03-01
previous_from: 2025-03-01
previous_to: 2026-02-28
internal_from: 2026-01-01

generation:
  provider: openai
  model: gpt-6-astra
  # gpt-6-astra must state a reasoning level; medium is the provider default v1 ran at.
  # No temperature: the model rejects one (S1 E8).
  reasoning: medium
  max_output_tokens: 4000
checker:
  provider: anthropic
  model: claude-sonnet-5-5
  reasoning: "off"
  max_output_tokens: 400
# A failed draft is sent back with the reason; after this many attempts the build stops.
max_attempts: 4
section_tokens: [450, 1000]
article_tokens: [120, 220]
internal_section_tokens: [350, 800]
# The long-context pack must leave this much of a 128,000-token window free (o200k_base).
pack_limit_tokens: 120000

products:
  - Brio kettle
  - Tessa dishwasher
  - Orrin heat pump
  - Lumen smart thermostat
  - Keel washing machine
  - Ashby tumble dryer
  - Vale fridge freezer
  - Corra induction hob
  - Fenwick cooker hood
  - Mira robot vacuum
plans: [Extended Care, Extended Care Plus]
# Service regions and the postcode areas each covers. Bridge questions go from a postcode area
# to its region, then to that region's terms in another policy.
regions:
  Scotland North: [AB, IV, KW, PH, DD]
  Scotland South: [EH, G, KA, ML, TD]
  North of England: [NE, LS, M, YO, CA]
  Midlands: [B, CV, DE, LE, NG]
  Wales and West: [CF, SA, LL, BS, GL]
  London and South East: [N, SE, BN, CT, ME]
  Northern Ireland: [BT]
  Island Areas: [GY, JE, IM, HS, ZE]

# Value kinds: how a planted value is written. Every planted value is unique in the library.
kinds:
  days: "{n} days"
  working_days: "{n} working days"
  weeks: "{n} weeks"
  months: "{n} months"
  hours: "{n} hours"
  minutes: "{n} minutes"
  years: "{n} years"
  pounds: "£{n}.00"
  percent: "{n}%"
  centimetres: "{n} centimetres"
  metres: "{n} metres"
  degrees: "{n} degrees"
  miles: "{n} miles"
  batch: "batch {n}"

# Each attribute is a family of facts: one per entity in its scope. `named` names the entity;
# `bare` relies on the heading for it; `lead` names the entity without the value, and is
# followed by `bare` in a two-sentence fact. `twin` is a look-alike attribute in another
# document, for distractor items.
policies:
  - doc_id: POL-WAR
    title: Warranty
    general:
      - heading: Registering your appliance
        attributes:
          - {id: war-register, kind: days, range: [14, 120], named: "Register a new appliance within {value} of delivery to activate the standard warranty."}
          - {id: war-proof, kind: months, range: [12, 72], named: "Keep your proof of purchase for at least {value} after delivery."}
      - heading: Making a claim
        attributes:
          - {id: war-reply, kind: working_days, range: [2, 30], named: "Halvard Home replies to a warranty claim within {value} of receiving it."}
          - {id: war-phone, kind: hours, range: [2, 72], named: "A claim made by phone is logged within {value}."}
      - heading: What the warranty does not cover
        attributes:
          - {id: war-misuse, kind: pounds, range: [20, 150], named: "An inspection that finds misuse is charged at {value}."}
          - {id: war-cosmetic, kind: days, range: [3, 30], named: "Cosmetic damage must be reported within {value} of delivery."}
    product:
      - heading: Cover period
        attributes:
          - {id: war-cover, kind: months, range: [12, 84], twin: ser-service,
             named: "The {entity} is covered for {value} from the date of delivery.",
             bare: "Cover lasts {value} from the date of delivery.",
             lead: "Cover for the {entity} starts on the day it is delivered, not the day it was ordered."}
          - {id: war-parts, kind: days, range: [60, 365], twin: saf-check,
             named: "Replacement parts fitted to the {entity} are covered for a further {value}.",
             bare: "Replacement parts fitted under the warranty are covered for a further {value}.",
             lead: "Parts fitted to the {entity} during a warranty repair carry their own cover."}
          - {id: war-labour, kind: months, range: [3, 36],
             named: "Labour for repairs to the {entity} is free for the first {value}.",
             bare: "Labour for repairs is free for the first {value}.",
             lead: "Repairs to the {entity} include labour only for an opening period."}
          - {id: war-transfer, kind: days, range: [7, 90],
             named: "If the {entity} is sold on, the new owner must transfer the warranty within {value}.",
