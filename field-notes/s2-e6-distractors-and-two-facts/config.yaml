# S2 E6: do look-alike passages and two-fact questions break a long-context lookup at 128,000
# tokens?
#
# Every setting a model ran with is recorded here, so the run can be reproduced exactly.
# Every model must be listed in src/lab/providers/capabilities.yaml.
experiment: s2-e6-distractors-and-two-facts
description: Long-context lookup with look-alike distractors and two-fact questions
seed: 20261004

# S1 E7's three models and settings, unchanged.
models:
  - provider: openai
    model: gpt-5.6-terra
    label: GPT-5.6 Terra
    modes:
      standard: { reasoning: off, temperature: null, max_output_tokens: 50 }
  - provider: anthropic
    model: claude-sonnet-5
    label: Claude Sonnet 5
    modes:
      standard: { reasoning: off, temperature: null, max_output_tokens: 50 }
  - provider: google
    model: gemini-3.6-flash
    label: Gemini 3.6 Flash
    modes:
      # Gemini 3.x cannot turn thinking off; "minimal" is its lowest level, and the limit leaves
      # room for reasoning tokens, which are billed as output (as S1 E7).
      standard: { reasoning: minimal, temperature: null, max_output_tokens: 1024 }

parameters:
  context_lengths_tokens: [16000, 64000, 128000]
  shapes: [single, distractors, two-fact, two-fact-distractors]
  # Two fact sets per book, six books: 12 items per model, shape and length.
  fact_sets_per_book: 2
  # Tolerances from S1 E7. The build fails outside them.
  length_tolerance_percent: 5
  position_tolerance_points: 2
  # Placement, in percent of the filler. See PREREGISTRATION.md.
  target_range_percent: [25, 75]
  early_range_percent: [10, 30]
  late_range_percent: [70, 90]
  min_gap_points: 10
  # Pass marks for the pre-registered claims. PREREGISTRATION.md states the same numbers, and a
  # test checks the two agree. Never edited after the full run.
  pass_marks:
    h0_single_correct_per_model: 34   # of 36, across the three lengths
    h0_single_correct_pooled_128k: 34 # of 36
    h1_drop_points: 10
    h1_distractor_replies: 3
    h2_drop_points: 10
    h3_drop_points: 5
    h4_drop_points: 10
  # S1 E7's six books, same pins and checks, except Frankenstein (Gutenberg 84). Its prose gives
  # only 87,723 tokens after the front matter is skipped, short of 128,000, so it is replaced
  # with Jane Eyre, pinned on 4 October 2026 from the same mirror.
  filler_books:
    - id: 1342
      title: Pride and Prejudice
      author: Jane Austen
      sha256: 81300b79e8a8d65ac530a97578417d06137e3bbc90622a10a65e5036183d2500
    - id: 2701
      title: Moby Dick; or, The Whale
      author: Herman Melville
      sha256: 547de799c1643ef231cc1efe45ffccefcb876ff3fe8f2206e7488529ad08f999
    - id: 1400
      title: Great Expectations
      author: Charles Dickens
      sha256: 48dd8f292e68ff2856675a60b48bcd80b1ebe6ed58ac3e6f91a2bb2400f1e345
    - id: 98
      title: A Tale of Two Cities
      author: Charles Dickens
      sha256: e3dfeb67feb904ac0f73a35204a175c58248422c2be8556802cb8820d958d67c
    - id: 345
      title: Dracula
      author: Bram Stoker
      sha256: 8cf05c0f0ac5b282d84f2fb36dbccd744bdb5bce7b5612438a63b43cbe27b472
    - id: 1260
      title: Jane Eyre
      author: Charlotte Brontë
      sha256: 693618b2da336410626b96d793af9988215d39a8e5f192e3e7800c5f927d6c43

# As S1 E7. 128,000-token prompts are large against entry-level per-minute token limits, so
# concurrency stays at 2.
limits:
  openai: { max_concurrency: 2, requests_per_minute: 30 }
  anthropic: { max_concurrency: 2, requests_per_minute: 30 }
  google: { max_concurrency: 2, requests_per_minute: 30 }

measures_latency: false

# `lab estimate` also prints input tokens per model at each length.
estimate_by: context_length_tokens

# 15 calls: per model, the four shapes once at 16,000 tokens, and the hardest shape once at
# 128,000, so every provider takes the 128,000-token path before the full run.
pilot:
  strategy: filter
  include:
    - { context_length_tokens: 16000, item: 0 }
    - { context_length_tokens: 128000, shape: two-fact-distractors, item: 0 }
